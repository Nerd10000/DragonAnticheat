prefix: "&5&lDragon &7|&r "

format: "%prefix% %p% &dfailed &5%check% &7(&d%vl% &8/ &5%max%&7) &7# %description%"

help_command:
  - "&5&lDragon &8v&5%version%"
  - " &7◆ &5ping &8— &7Shows your real ping according to transactions."
  - " &7◆ &5toggle-debug &8— &7[DO NOT ENABLE IT] It shows debug values in debug builds."
  - " &7Coming soon..."

incorrect_usage: "%prefix% &cIncorrect usage! For help run &8/dragon help&c!"

check_config_format: "&8- &5&l%checkname%&r &7max_vL: &5%max_vl% &7maxBuffer: &5%max_buffer% &7decay: &5%decay%"
config_command_header: "&5&lCheck settings: "
reload_command: "%prefix% &5Reloaded the configuration file!"
checks:
  Speed(A):
    max_vl: 10
    max_buffer: 20
    decay: 0.15
    limit: 1e-4
  Speed(B):
    max_vl: 10
    max_buffer: 20
    decay: 0.15
    limit1: 1e-5 # The limit before increasing the buffer when the player has not changed direction (yaw).
    limit2: 0.099 # The limit before increasing the buffer when the player changed direction (yaw).


  Aim(A):
    max_vl: 1
    max_buffer: 5
    decay: 0.10

  Fly(A):
    max_vl: 4
    max_buffer: 5
    decay: 0.3


